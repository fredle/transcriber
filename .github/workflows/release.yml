name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist), e.g. v0.1.0"
        required: true

permissions:
  # write is only needed for the one-time GitHub bridge release below -
  # drop back to read once that step is removed.
  contents: write
  id-token: write

jobs:
  release:
    runs-on: windows-latest
    environment: release

    steps:
      - name: Determine tag and version
        id: version
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Inject cloud config
        shell: pwsh
        env:
          BACKEND_URL: ${{ secrets.TEELINE_BACKEND_URL }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          $path = "MeetingTranscriber\Services\CloudConfig.cs"
          $content = Get-Content $path -Raw
          $content = $content.Replace('__TEELINE_BACKEND_URL__', $env:BACKEND_URL)
          $content = $content.Replace('__TEELINE_FIREBASE_API_KEY__', $env:FIREBASE_API_KEY)
          $content = $content.Replace('__TEELINE_GOOGLE_CLIENT_ID__', $env:GOOGLE_CLIENT_ID)
          $content = $content.Replace('__TEELINE_GOOGLE_CLIENT_SECRET__', $env:GOOGLE_CLIENT_SECRET)
          Set-Content -Path $path -Value $content -NoNewline

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f "tag_name=${{ steps.version.outputs.tag }}" \
            --jq .body > notes.md
          cat notes.md

      - name: Install Velopack CLI
        run: dotnet tool install --global vpk

      - name: Download previous releases
        # So `vpk pack` can compute deltas against the last published version.
        # Nothing to download yet on the very first release.
        shell: pwsh
        run: |
          vpk download http --url "https://teeline-releases.web.app/" --outputDir Releases --channel win
          if ($LASTEXITCODE -ne 0) { Write-Host "No previous release found (first release?) - continuing with a clean Releases dir." }
          exit 0

      - name: Publish self-contained build
        run: >
          dotnet publish MeetingTranscriber/MeetingTranscriber.csproj
          -c Release
          -p:Version=${{ steps.version.outputs.version }}
          -p:FileVersion=${{ steps.version.outputs.version }}.0
          -p:AssemblyVersion=${{ steps.version.outputs.version }}.0

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Teeline.exe (Azure Trusted Signing)
        uses: Azure/artifact-signing-action@v2.0.0
        with:
          endpoint: https://weu.codesigning.azure.net/
          signing-account-name: leatham-signing-account
          certificate-profile-name: cert-profile
          files-folder: ${{ github.workspace }}\MeetingTranscriber\bin\Release\net8.0-windows\win-x64\publish
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Pack release (Velopack)
        # Produces, in Releases/: the update feed (releases.win.json - merged
        # with whatever was downloaded above, containing delta packages back
        # to the previous version), Teeline-<ver>-full.nupkg (containing the
        # already-signed Teeline.exe), Teeline-win-Setup.exe (installer/
        # bootstrapper - signed next, since it doesn't exist until this step),
        # and Teeline-win-Portable.zip (a portable copy, no installer, no
        # auto-update).
        shell: pwsh
        run: |
          vpk pack `
            --packId Teeline `
            --packVersion ${{ steps.version.outputs.version }} `
            --packDir "MeetingTranscriber\bin\Release\net8.0-windows\win-x64\publish" `
            --mainExe Teeline.exe `
            --packTitle Teeline `
            --packAuthors "FBL Consulting Ltd" `
            --icon MeetingTranscriber\assets\teeline.ico `
            --releaseNotes notes.md `
            --outputDir Releases

      - name: Sign the installer (Azure Trusted Signing)
        uses: Azure/artifact-signing-action@v2.0.0
        with:
          endpoint: https://weu.codesigning.azure.net/
          signing-account-name: leatham-signing-account
          certificate-profile-name: cert-profile
          files-folder: ${{ github.workspace }}\Releases
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Add versioned release notes for the What's New popup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "Releases\notes" | Out-Null
          Copy-Item notes.md "Releases\notes\${{ steps.version.outputs.version }}.md"

      - name: ONE-TIME BRIDGE RELEASE - publish to GitHub too
        # Every install up to and including v0.4.0 has the old UpdateService
        # baked in, which only ever checks GitHub Releases. If this version
        # only went to Firebase Hosting, those installs would silently never
        # see another update again. Publishing this one version to GitHub
        # too lets them pick it up one last time and switch over to checking
        # Firebase from then on. Delete this step (and drop `contents:` back
        # to `read` above) once this release is out.
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          vpk upload github `
            --repoUrl https://github.com/fredle/transcriber `
            --token $env:GITHUB_TOKEN `
            --tag ${{ steps.version.outputs.tag }} `
            --releaseName "Teeline ${{ steps.version.outputs.tag }}" `
            --outputDir Releases `
            --publish
          if ($LASTEXITCODE -ne 0) { throw "vpk upload github failed with exit code $LASTEXITCODE" }

      - name: ONE-TIME BRIDGE RELEASE - set release notes on the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release edit "${{ steps.version.outputs.tag }}" --notes-file notes.md

      - name: GCP login (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Deploy release feed to Firebase Hosting
        shell: bash
        run: |
          npx firebase-tools@15 deploy --only hosting:${{ vars.FIREBASE_HOSTING_SITE }} \
            --project ${{ vars.FIREBASE_PROJECT_ID }} \
            --non-interactive
